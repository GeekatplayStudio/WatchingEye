[workspace]
resolver = "2"
members = [
    "crates/schemas",
    "crates/events",
    "crates/rules",
    "crates/guardrails",
    "crates/camera",
    "crates/detector",
    "crates/tracker",
    "services/vision-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geekatplay/WatchingEye"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"

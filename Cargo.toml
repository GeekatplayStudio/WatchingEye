[workspace]
resolver = "2"
members = [
    "crates/schemas",
    "crates/events",
    "crates/rules",
    "crates/guardrails",
    "crates/camera",
    "crates/motion",
    "crates/detector",
    "crates/tracker",
    "crates/identity",
    "crates/actuator",
    "crates/spatial",
    "services/vision-engine",
    "services/edge-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geekatplay/WatchingEye"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"

# Desktop release: maximum speed. Fat LTO and a single codegen unit let the
# optimizer see across crate boundaries (the pipeline is many small crates);
# stripping symbols roughly halves the binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Edge/embedded: smallest possible binary for Raspberry Pi-class devices.
# `z` trades some straight-line speed for size; the pipeline math is small
# enough that the difference is measured, not felt.
[profile.edge]
inherits = "release"
opt-level = "z"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Deny (licenses & advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ROADMAP 3.2 / A.2b — prove edge-node still links for Pi-class aarch64.
  # Does not claim offline SQLite sync or on-device smoke on real hardware.
  edge-node-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: edge-node-aarch64
      - name: Install aarch64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile edge-node (profile edge)
        run: cargo build -p edge-node --profile edge --target aarch64-unknown-linux-gnu
      - name: Report binary size
        run: |
          BIN=target/aarch64-unknown-linux-gnu/edge/edge-node
          ls -la "$BIN"
          SIZE=$(stat -c%s "$BIN")
          echo "edge-node aarch64 (profile edge) size: ${SIZE} bytes"
          # Soft ceiling — catch accidental dependency bloat; not the 309 KB claim.
          # Soft ceiling: bundled SQLite (offline cache, ROADMAP 3.2) grows the
          # binary past the old 1 MiB target; keep a honest Pi-class budget.
          test "$SIZE" -lt 3145728

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit

  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run demo -- --fixture
      - run: npx tsc --noEmit

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
